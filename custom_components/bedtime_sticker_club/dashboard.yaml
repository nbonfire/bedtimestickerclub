# Install Button Card v7 through HACS before loading this dashboard.
# Personalize the three child cards at the bottom; keep child_id unchanged.
title: Bedtime Sticker Club
button_card_templates:
  bedtime_task:
    entity: '[[[ return `sensor.bedtime_${variables.child_id}`; ]]]'
    triggers_update: all
    update_timer: 1s
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: >-
        [[[ return hass.connected !== false && hass.connection?.connected !== false
          && entity && !['unknown', 'unavailable'].includes(entity.state)
          && entity.attributes.routine_date === states['sensor.bedtime_routine']?.attributes.routine_date
          ? 'call-service' : 'none'; ]]]
      service: bedtime_sticker_club.set_task
      service_data:
        child_id: '[[[ return variables.child_id; ]]]'
        task: '[[[ return variables.task; ]]]'
        completed: '[[[ return !entity?.attributes.tasks?.[variables.task]; ]]]'
        routine_date: '[[[ return entity?.attributes.routine_date; ]]]'
    hold_action: {action: none}
    double_tap_action: {action: none}
    styles:
      card:
        - min-height: 68px
        - padding: 10px 12px
        - border-radius: 18px
        - box-shadow: none
        - color: '#24203b'
        - background: '[[[ return entity?.attributes.tasks?.[variables.task] ? variables.tint : "#ffffff"; ]]]'
        - border: >-
            [[[ const phase = states['sensor.bedtime_routine']?.state;
              const next = phase === 'dinner' ? variables.task === 'plate'
                : phase === 'bedtime' && variables.task !== 'plate';
              return `2px solid ${!entity?.attributes.tasks?.[variables.task] && next ? variables.accent : '#e7e2ed'}`; ]]]
        - opacity: '[[[ return hass.connected === false || hass.connection?.connected === false || !entity || ["unknown", "unavailable"].includes(entity.state) ? "0.5" : "1"; ]]]'
      grid:
        - grid-template-areas: '"content"'
        - grid-template-columns: 1fr
      custom_fields:
        content:
          - width: 100%
          - text-align: left
          - white-space: normal
    custom_fields:
      content: >-
        [[[ const done = entity?.attributes.tasks?.[variables.task];
          const phase = states['sensor.bedtime_routine']?.state;
          const next = !done && (phase === 'dinner' ? variables.task === 'plate'
            : phase === 'bedtime' && variables.task !== 'plate');
          const tasks = {plate: ['🍽️', 'Clear my plate'], teeth: ['🪥', 'Brush my teeth'], outfit: ['👕', "Pick tomorrow’s outfit"]};
          const [emoji, label] = tasks[variables.task];
          return `<div style="display:flex;align-items:center;gap:10px">
            <span aria-hidden="true" style="font-size:29px">${emoji}</span>
            <span style="flex:1;font-size:16px;font-weight:750;line-height:1.25">${label}
              ${next ? `<span style="display:block;font-size:11px;letter-spacing:.05em;color:${variables.accent};margin-top:3px">UP NEXT</span>` : ''}</span>
            <span aria-label="${done ? 'Completed' : 'Not completed'}" style="display:grid;place-items:center;flex:none;width:27px;height:27px;border:2px solid ${done ? variables.accent : '#bcb5ca'};border-radius:10px;background:${done ? variables.accent : '#fff'};color:white;font-size:19px;font-weight:900">${done ? '✓' : ''}</span>
          </div>`; ]]]

  bedtime_sticker:
    entity: '[[[ return `sensor.bedtime_${variables.child_id}`; ]]]'
    triggers_update: all
    update_timer: 1s
    show_icon: false
    name: '[[[ return variables.sticker; ]]]'
    tap_action:
      action: >-
        [[[ return hass.connected !== false && hass.connection?.connected !== false
          && entity && !['unknown', 'unavailable'].includes(entity.state)
          && entity.attributes.completed === 3
          && entity.attributes.routine_date === states['sensor.bedtime_routine']?.attributes.routine_date
          ? 'call-service' : 'none'; ]]]
      service: bedtime_sticker_club.choose_sticker
      service_data:
        child_id: '[[[ return variables.child_id; ]]]'
        routine_date: '[[[ return entity?.attributes.routine_date; ]]]'
        sticker: '[[[ return variables.sticker; ]]]'
    hold_action: {action: none}
    double_tap_action: {action: none}
    styles:
      card:
        - height: 56px
        - padding: 0
        - border-radius: 15px
        - box-shadow: none
        - background: '#ffffff'
        - border: '[[[ return `2px solid ${entity?.attributes.stickers?.[entity?.attributes.routine_date]?.emoji === variables.sticker ? variables.accent : "#e7e2ed"}`; ]]]'
      name:
        - font-size: 30px

  bedtime_child:
    entity: '[[[ return `sensor.bedtime_${variables.child_id}`; ]]]'
    triggers_update: all
    update_timer: 1s
    show_icon: false
    show_name: false
    tap_action: {action: none}
    hold_action: {action: none}
    styles:
      card:
        - padding: 18px
        - background: '#fffefb'
        - color: '#24203b'
        - border: '[[[ return `3px solid ${variables.accent}`; ]]]'
        - border-radius: 28px
        - box-shadow: '[[[ return `4px 5px 0 ${variables.accent}25`; ]]]'
        - overflow: hidden
        - font-family: 'ui-rounded, "Avenir Next", system-ui, sans-serif'
      grid:
        - grid-template-areas: '"identity" "progress" "plate" "teeth" "outfit" "celebration" "picker" "calendar" "total"'
        - grid-template-columns: minmax(0, 1fr)
        - row-gap: 10px
      custom_fields:
        identity: [{width: 100%}, {text-align: left}]
        progress: [{width: 100%}, {text-align: left}]
        celebration:
          - display: '[[[ return entity?.attributes.completed === 3 ? "block" : "none"; ]]]'
          - white-space: normal
          - color: '[[[ return variables.accent; ]]]'
          - font-size: 15px
          - font-weight: 800
          - animation: '[[[ return entity?.attributes.completed === 3 ? "sticker-pop .4s ease-out" : "none"; ]]]'
        picker:
          - display: '[[[ return entity?.attributes.completed === 3 ? "block" : "none"; ]]]'
        calendar:
          - width: 100%
          - white-space: normal
        total:
          - font-size: 13px
          - font-weight: 700
          - color: '#625b74'
    extra_styles: |
      @keyframes sticker-pop {
        0% { transform: scale(.92); }
        55% { transform: scale(1.04); }
        100% { transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #celebration { animation: none !important; }
      }
    custom_fields:
      identity: >-
        [[[ const escape = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          return `<div style="display:flex;align-items:center;gap:12px">
            <span style="display:grid;place-items:center;width:58px;height:58px;border-radius:20px;background:${variables.tint};font-size:37px">${escape(variables.avatar)}</span>
            <div><div style="font-size:27px;font-weight:850;letter-spacing:-.04em">${escape(variables.child_name)}</div>
            <div style="font-size:12px;color:#625b74;margin-top:2px">My bedtime checklist</div></div></div>`; ]]]
      progress: >-
        [[[ const ready = entity && !['unknown', 'unavailable'].includes(entity.state);
          const n = ready ? entity.attributes.completed || 0 : 0;
          return `<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:750;margin:2px 0 7px">
            <span>${ready ? (n === 3 ? 'All done. Nice work!' : `${n} of 3 done`) : 'Waiting for Home Assistant…'}</span>
            <span aria-hidden="true">${'●'.repeat(n)}${'○'.repeat(3-n)}</span></div>
            <div role="progressbar" aria-label="Bedtime tasks" aria-valuemin="0" aria-valuemax="3" aria-valuenow="${n}" style="height:8px;background:#eeebf2;border-radius:9px;overflow:hidden;margin-bottom:4px">
            <div style="width:${n/3*100}%;height:100%;background:${variables.accent}"></div></div>`; ]]]
      plate:
        card:
          type: custom:button-card
          template: bedtime_task
          variables:
            child_id: '[[[ return variables.child_id; ]]]'
            task: plate
            accent: '[[[ return variables.accent; ]]]'
            tint: '[[[ return variables.tint; ]]]'
      teeth:
        card:
          type: custom:button-card
          template: bedtime_task
          variables:
            child_id: '[[[ return variables.child_id; ]]]'
            task: teeth
            accent: '[[[ return variables.accent; ]]]'
            tint: '[[[ return variables.tint; ]]]'
      outfit:
        card:
          type: custom:button-card
          template: bedtime_task
          variables:
            child_id: '[[[ return variables.child_id; ]]]'
            task: outfit
            accent: '[[[ return variables.accent; ]]]'
            tint: '[[[ return variables.tint; ]]]'
      celebration: 'You earned a sticker! Pick your favorite ↓'
      picker:
        card:
          type: grid
          columns: 4
          square: false
          cards:
            - type: custom:button-card
              template: bedtime_sticker
              variables:
                child_id: '[[[ return variables.child_id; ]]]'
                accent: '[[[ return variables.accent; ]]]'
                sticker: '⭐'
            - type: custom:button-card
              template: bedtime_sticker
              variables:
                child_id: '[[[ return variables.child_id; ]]]'
                accent: '[[[ return variables.accent; ]]]'
                sticker: '🌈'
            - type: custom:button-card
              template: bedtime_sticker
              variables:
                child_id: '[[[ return variables.child_id; ]]]'
                accent: '[[[ return variables.accent; ]]]'
                sticker: '🚀'
            - type: custom:button-card
              template: bedtime_sticker
              variables:
                child_id: '[[[ return variables.child_id; ]]]'
                accent: '[[[ return variables.accent; ]]]'
                sticker: '🦄'
            - type: custom:button-card
              template: bedtime_sticker
              variables:
                child_id: '[[[ return variables.child_id; ]]]'
                accent: '[[[ return variables.accent; ]]]'
                sticker: '🦖'
            - type: custom:button-card
              template: bedtime_sticker
              variables:
                child_id: '[[[ return variables.child_id; ]]]'
                accent: '[[[ return variables.accent; ]]]'
                sticker: '🐱'
            - type: custom:button-card
              template: bedtime_sticker
              variables:
                child_id: '[[[ return variables.child_id; ]]]'
                accent: '[[[ return variables.accent; ]]]'
                sticker: '🦋'
            - type: custom:button-card
              template: bedtime_sticker
              variables:
                child_id: '[[[ return variables.child_id; ]]]'
                accent: '[[[ return variables.accent; ]]]'
                sticker: '⚽'
      calendar: >-
        [[[ const attrs = entity?.attributes || {};
          const day = attrs.routine_date;
          if (!day || !attrs.month) return '<div style="padding:20px">Your sticker page is loading…</div>';
          const [year, month] = attrs.month.split('-').map(Number);
          // Calendar math uses UTC explicitly; the authoritative date comes from HA.
          const first = new Date(Date.UTC(year, month-1, 1));
          const count = new Date(Date.UTC(year, month, 0)).getUTCDate();
          const title = first.toLocaleDateString('en-US', {month:'long', year:'numeric', timeZone:'UTC'});
          let cells = ['S','M','T','W','T','F','S'].map(d => `<span style="font-size:10px;font-weight:800;color:#756d84">${d}</span>`).join('');
          for (let i=0; i<first.getUTCDay(); i++) cells += '<span></span>';
          for (let n=1; n<=count; n++) {
            const date = `${attrs.month}-${String(n).padStart(2,'0')}`;
            const record = attrs.stickers?.[date];
            const earned = record?.earned;
            const safeEmoji = ['⭐','🌈','🚀','🦄','🦖','🐱','🦋','⚽'].includes(record?.emoji) ? record.emoji : '⭐';
            const today = date === day;
            cells += `<span title="${date}${earned ? ': earned sticker' : ''}" aria-label="${date}${earned ? ': earned '+safeEmoji : today ? ': today' : ''}" style="display:grid;place-items:center;min-width:0;height:30px;border-radius:10px;font-size:${earned ? '21' : '11'}px;font-weight:${today ? '850' : '600'};background:${earned ? variables.tint : '#f6f3f8'};border:2px solid ${today ? variables.accent : 'transparent'};color:${date>day ? '#898192' : '#625b74'}">${earned ? safeEmoji : n}</span>`;
          }
          const earnedCount = Object.values(attrs.stickers || {}).filter(r => r.earned).length;
          return `<div style="margin-top:5px;border-top:2px dashed #e7e2ed;padding-top:13px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;text-align:left">
              <span style="font-size:14px;font-weight:850">${title}</span><span style="font-size:11px;color:#625b74">${earnedCount} earned</span></div>
            <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;align-items:center">${cells}</div></div>`; ]]]
      total: >-
        [[[ const ready = entity && !['unknown','unavailable'].includes(entity.state);
          return ready ? `🏆 ${entity.state} bedtime${entity.state === '1' ? '' : 's'} completed` : 'Saved progress will appear when connected'; ]]]

views:
  - title: Sticker Club
    path: tonight
    icon: mdi:star-face
    type: sections
    max_columns: 3
    background: '#fff4da'
    header:
      layout: responsive
      badges_position: bottom
      card:
        type: custom:button-card
        triggers_update: all
        update_timer: 1s
        show_icon: false
        show_name: false
        tap_action: {action: none}
        styles:
          card:
            - background: transparent
            - box-shadow: none
            - border: none
            - padding: 12px 4px 4px
            - color: '#24203b'
          grid:
            - grid-template-areas: '"heading settings" "message message"'
            - grid-template-columns: minmax(0, 1fr) 44px
            - row-gap: 8px
          custom_fields:
            heading: [{white-space: normal}, {text-align: left}, {width: 100%}]
            message: [{white-space: normal}, {text-align: left}, {width: 100%}]
        custom_fields:
          settings:
            card:
              type: custom:button-card
              icon: mdi:cog-outline
              name: Parent settings
              show_name: false
              tap_action:
                action: navigate
                navigation_path: /bedtime-club/parents
              styles:
                card: [{height: 44px}, {width: 44px}, {border: none}, {background: transparent}, {box-shadow: none}]
                icon: [{width: 24px}, {color: '#625b74'}]
          heading: >-
            [[[ return `<div style="font-family:ui-rounded,'Avenir Next',system-ui,sans-serif"><div style="font-size:11px;font-weight:850;letter-spacing:.16em;color:#655477;margin-bottom:5px">LITTLE HABITS · HAPPY MORNINGS</div><div style="font-size:clamp(25px,4vw,38px);font-weight:900;letter-spacing:-.045em;line-height:1.15">Bedtime Sticker Club <span aria-hidden="true">🌟</span></div></div>`; ]]]
          message: >-
            [[[ const connected = hass.connected !== false && hass.connection?.connected !== false;
              const ready = ['kid_1','kid_2','kid_3'].every(k => states[`sensor.bedtime_${k}`] && !['unknown','unavailable'].includes(states[`sensor.bedtime_${k}`].state));
              const phase = states['sensor.bedtime_routine']?.state;
              const messages = {daytime:'Tonight’s routine · Three little tasks, one happy sticker.', dinner:'Dinner time · Let’s clear our plates!', bedtime:'Getting cozy · Teeth brushed, tomorrow’s outfit ready.', invalid_schedule:'Check the reminder times in Parent settings. Your checklists still work.', loading:'Getting your sticker charts ready…'};
              const text = !connected ? 'Connection lost. Your saved stickers are safe. Reconnecting…' : !ready ? 'Waiting for saved progress from Home Assistant…' : messages[phase] || 'Getting your sticker charts ready…';
              return `<div role="status" style="font-size:14px;line-height:1.5;color:${!connected || !ready ? '#9c3918' : '#625b74'}">${text}</div>`; ]]]
    sections:
      - type: grid
        cards:
          - type: custom:button-card
            template: bedtime_child
            grid_options: {columns: full}
            variables:
              child_id: kid_1
              child_name: '[[[ return states["sensor.bedtime_kid_1"]?.attributes.child_name || "Kid 1"; ]]]'
              avatar: '🦊'
              accent: '#7541bf'
              tint: '#f0e6ff'
      - type: grid
        cards:
          - type: custom:button-card
            template: bedtime_child
            grid_options: {columns: full}
            variables:
              child_id: kid_2
              child_name: '[[[ return states["sensor.bedtime_kid_2"]?.attributes.child_name || "Kid 2"; ]]]'
              avatar: '🦖'
              accent: '#087e82'
              tint: '#d9f4ed'
      - type: grid
        cards:
          - type: custom:button-card
            template: bedtime_child
            grid_options: {columns: full}
            variables:
              child_id: kid_3
              child_name: '[[[ return states["sensor.bedtime_kid_3"]?.attributes.child_name || "Kid 3"; ]]]'
              avatar: '🦄'
              accent: '#b94d1c'
              tint: '#ffead9'
  - title: Parent settings
    path: parents
    icon: mdi:cog-outline
    subview: true
    cards:
      - type: markdown
        content: |
          ## Bedtime reminders

          These times highlight what is up next. All tasks stay available.

          Set dinner before bedtime, both at or after 4 am. A fresh routine starts at 4 am in Home Assistant's configured timezone.
      - type: entities
        show_header_toggle: false
        entities:
          - time.bedtime_dinner_time
          - time.bedtime_bedtime_time
