name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HACS integration
        uses: hacs/action@main
        with:
          category: integration
          comment: false

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate payload, tests, and Home Assistant configuration
        run: |
          docker run --rm --entrypoint sh -v "$PWD:/work:ro" \
            ghcr.io/home-assistant/home-assistant:2026.10.1 -c '
              set -eu
              python /work/scripts/validate_repository.py
              python -m unittest discover -s /work/tests -v
              mkdir -p /tmp/bedtime-check
              cp -R /work/custom_components /tmp/bedtime-check/
              cp /work/tests/configuration.yaml /tmp/bedtime-check/configuration.yaml
              python -m homeassistant --script check_config --config /tmp/bedtime-check
            '
